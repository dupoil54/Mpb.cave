<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cave de Tibati</title><style>
:root{--bg:#f5f2ee;--ink:#211b1a;--wine:#641f32;--gold:#c69b52;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:var(--ink)}header{background:#27191d;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px;color:#e5c17c}.wrap{max-width:1250px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 10px #0001;margin-bottom:12px}.metric{font-size:26px;font-weight:bold;color:var(--wine)}button{background:var(--wine);color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;margin:3px}button.alt{background:#796b65}button.danger{background:#a12b35}input,select{padding:10px;border:1px solid #ddd;border-radius:7px;margin:4px;max-width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}small{color:#777}.pill{background:#f4e6d9;border-radius:20px;padding:5px 9px}nav{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}nav button{background:#80666a}.dangerText{color:#b21d32}.clickable{cursor:pointer}.clickable:hover{outline:2px solid var(--gold)}.wide{width:100%;max-width:420px}h2{color:var(--wine)}
.cart-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;align-items:start}
.cart-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;max-height:65vh;overflow:auto;padding:3px}
.product-tile{background:#fff;border:1px solid #eadfe0;border-radius:10px;padding:12px;cursor:pointer;text-align:left;color:var(--ink);margin:0}
.product-tile:hover{border-color:var(--gold);box-shadow:0 2px 9px #0001}.product-tile:disabled{opacity:.45;cursor:not-allowed}
.stock-category h3{color:var(--wine);margin:0}.stock-category{border-left:5px solid var(--gold)}.cart-panel{position:sticky;top:10px}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;border-bottom:1px solid #eee;padding:9px 0}.qty-tools{display:flex;align-items:center;gap:4px}.qty-tools button{padding:5px 9px;margin:0}.cart-total{font-size:23px;font-weight:bold;color:var(--wine);text-align:right;padding:12px 0}
@media(max-width:800px){.cart-layout{grid-template-columns:1fr}.cart-panel{position:static}.cart-products{max-height:none}}
@media(max-width:600px){header{align-items:flex-start;gap:8px;flex-direction:column}.wrap{padding:10px}td,th{padding:6px;font-size:13px}input,select{width:100%;margin:4px 0}.row{display:block}}

/* Impression thermique 58 mm : largeur utile 48 mm pour la Zonerich AB-320M */
@media print {
  @page { size: 58mm auto; margin: 3mm; }
  body { background:#fff !important; color:#000 !important; font:10px monospace !important; }
  body * { visibility:hidden !important; }
  #receiptPrint, #receiptPrint * { visibility:visible !important; }
  #receiptPrint { position:absolute; left:0; top:0; width:48mm; padding:0; margin:0; }
  #receiptPrint h2 { color:#000 !important; font-size:14px; text-align:center; margin:0 0 5px; }
  #receiptPrint p { margin:3px 0; }
  #receiptPrint .line { border-top:1px dashed #000; margin:5px 0; }
  #receiptPrint .item { display:flex; justify-content:space-between; gap:4px; }
  #receiptPrint .total { font-weight:bold; font-size:13px; }
  #receiptPrint .center { text-align:center; }
}
</style></head><body><header><b>🍷 CAVE DE TIBATI</b><span id="who">Gestion intégrée</span></header><main class="wrap">
<section id="login" class="card wide"><h2>Connexion</h2><p>Choisissez votre poste, puis saisissez votre PIN.</p><select id="role" class="wide"><option value="admin">Administrateur</option><option value="shareholder">Actionnaire</option><option value="service">Service</option><option value="cashier">Caisse</option></select><input id="pin" class="wide" type="password" inputmode="numeric" placeholder="PIN personnel" maxlength="12"><button onclick="login()">Se connecter</button><p><small>Premier accès administrateur : PIN provisoire 1234. Changez-le dès la première connexion.</small></p></section>
<section id="app" class="hidden"><nav id="nav"></nav><div id="view"></div></section></main><script>
let token='',me=null,products=[],tables=[];const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);const monthNow=()=>today().slice(0,7);const money=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';
const api=async(path,method='GET',body=null)=>{let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','Authorization':token},body:body?JSON.stringify(body):null});let d=await r.json();if(!r.ok)throw Error(d.detail||'Erreur');return d};
function allowed(page){let r=me.role;if(['home','tables'].includes(page))return true;if(page==='credits'||page==='journal')return ['admin','shareholder','cashier'].includes(r);return ['admin','shareholder'].includes(r)}
function buildNav(){let pages=[['home','Tableau de bord'],['tables','Tables & reçus']];if(['admin','shareholder'].includes(me.role))pages.push(['stock','Stock'],['staff','Employés'],['payroll','Présences & salaires'],['expenses','Charges'],['reports','Ventes & bénéfices']);if(['admin','shareholder','cashier'].includes(me.role))pages.push(['credits','Ardoises'],['journal','Journal']);$('nav').innerHTML=pages.map(p=>`<button onclick="show('${p[0]}')">${p[1]}</button>`).join('')+`<button class="alt" onclick="changeOwnPin()">Changer mon PIN</button><button class="alt" onclick="logout()">Déconnexion</button>`}
async function login(){try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value,role:$('role').value})});let d=await r.json();if(!r.ok)throw Error(d.detail);token=d.token;me=d.employee;localStorage.setItem('cave_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.name+' · '+({admin:'Administrateur',shareholder:'Actionnaire',service:'Service',cashier:'Caisse'}[me.role]);buildNav();if(d.must_change_pin){let old=$('pin').value;let np=prompt('Choisissez votre nouveau PIN (4 chiffres minimum)');if(!old||!np)throw Error('Le changement du PIN est obligatoire. Reconnectez-vous.');await api('/change-pin','POST',{old_pin:old,new_pin:np});alert('PIN modifié avec succès.')}show('home')}catch(e){alert(e.message);if(token){localStorage.removeItem('cave_token');token='';location.reload()}}}
async function logout(){try{await api('/logout','POST',{})}catch(e){}localStorage.removeItem('cave_token');token='';me=null;location.reload()}
async function changeOwnPin(){let old=prompt('Ancien PIN :');if(old===null)return;let np=prompt('Nouveau PIN (4 chiffres minimum) :');if(np===null)return;try{await api('/change-pin','POST',{old_pin:old,new_pin:np});alert('PIN modifié.')}catch(e){alert(e.message)}}
async function restoreSession(){let saved=localStorage.getItem('cave_token');if(!saved)return;token=saved;try{let d=await api('/me');me=d.employee;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.name+' · '+({admin:'Administrateur',shareholder:'Actionnaire',service:'Service',cashier:'Caisse'}[me.role]);buildNav();if(d.must_change_pin){let old=prompt('Votre PIN initial doit être changé. Ancien PIN :');let np=prompt('Nouveau PIN :');if(!old||!np)throw Error('Changement de PIN obligatoire');await api('/change-pin','POST',{old_pin:old,new_pin:np})}show('home')}catch(e){localStorage.removeItem('cave_token');token='';me=null}}
async function show(page,stockFilter='all'){if(!allowed(page)){alert('Accès non autorisé');return}try{
if(page==='home'){let d=await api('/dashboard');if(me.role==='service'){view.innerHTML='<h2>Espace Service</h2><div class="card"><p>Accédez aux tables et aux reçus pour enregistrer les commandes des clients.</p><button onclick="show(\'tables\')">Ouvrir Tables & reçus</button></div>';return}if(me.role==='cashier'){view.innerHTML=`<h2>Espace Caisse</h2><div class="grid"><div class="card clickable" onclick="show('tables')">Commandes en attente<div class="metric">${d.open_orders.n}</div></div><div class="card clickable" onclick="show('credits')">Ardoises ouvertes<div class="metric">${money(d.credits)}</div></div><div class="card clickable" onclick="show('journal')">Journal<div class="metric">Consulter</div></div></div>`;return}view.innerHTML=`<h2>Tableau de bord</h2><div class="grid"><div class="card clickable" onclick="show('stock')">Références produits<div class="metric">${d.products.n}</div><small>Voir le stock</small></div><div class="card clickable" onclick="show('stock','rupture')">Ruptures<div class="metric dangerText">${d.products.ruptures||0}</div></div><div class="card clickable" onclick="show('stock','alerte')">Alertes stock<div class="metric">${d.products.alertes||0}</div></div><div class="card clickable" onclick="show('stock')">Valeur du stock<div class="metric">${money(d.products.valeur)}</div></div><div class="card clickable" onclick="show('credits')">Ardoises ouvertes<div class="metric">${money(d.credits)}</div></div><div class="card clickable" onclick="show('tables')">Commandes en attente<div class="metric">${d.open_orders.n}</div><small>Ouvrir les reçus</small></div><div class="card clickable" onclick="show('reports')">Rapports financiers<div class="metric">Voir</div></div><div class="card clickable" onclick="show('payroll')">Présences & salaires<div class="metric">Gérer</div></div></div>`}
if(page==='stock'){products=await api('/products');let shownProducts=products.filter(p=>stockFilter==='rupture'?Number(p.stock)<=0:stockFilter==='alerte'?Number(p.stock)>0&&Number(p.stock)<=Number(p.alert||5):true);let grouped=shownProducts.reduce((acc,p)=>{let cat=(p.category||'Autres').trim()||'Autres';(acc[cat]??=[]).push(p);return acc},{});let stockGroups=Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([cat,items])=>`<section class=\"card stock-category\"><div class=\"row\"><h3 style=\"margin-right:auto\">${cat}</h3><span class=\"pill\">${items.length} article(s)</span><span class=\"pill\">${items.reduce((n,p)=>n+Number(p.stock||0),0)} en stock</span></div><table><tr><th>Article</th><th>Stock</th><th>Achat</th><th>Vente</th><th>Action</th></tr>${items.map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><button class=\"alt\" onclick='renameProduct(${p.id},${JSON.stringify(p.name)})'>Renommer</button><button class=\"danger\" onclick=\"archiveProduct(${p.id})\">Archiver</button></td></tr>`).join('')}</table></section>`).join('');view.innerHTML=`<h2>Gestion du stock</h2>${stockFilter!=='all'?`<div class=\"card\"><b>Filtre actif : ${stockFilter==='rupture'?'Articles en rupture':'Articles en alerte'}</b> <button class=\"alt\" onclick=\"show('stock')\">Afficher tout le stock</button></div>`:''}<div class=\"card\"><h3>Nouvel article</h3><div class=\"row\"><input id=\"pn\" placeholder=\"Libellé obligatoire\"><input id=\"pq\" type=\"number\" min=\"0\" step=\".01\" placeholder=\"Quantité initiale\"><input id=\"pcat\" placeholder=\"Catégorie\"><input id=\"pcost\" type=\"number\" min=\"0\" placeholder=\"Prix d'achat\"><input id=\"pprice\" type=\"number\" min=\"0\" placeholder=\"Prix de vente\"><button onclick=\"addProduct()\">Enregistrer</button></div></div><div class=\"card\"><h3>Mouvement de stock</h3>${products.length?`<select id=\"mp\">${products.map(p=>`<option value=\"${p.id}\">${p.name} (stock ${p.stock})</option>`).join('')}</select><select id=\"mk\"><option value=\"in\">Entrée</option><option value=\"out\">Sortie</option><option value=\"adjust\">Ajuster à</option></select><input id=\"mq\" type=\"number\" min=\".01\" step=\".01\" placeholder=\"Quantité\"><input id=\"mn\" placeholder=\"Motif\"><button onclick=\"moveStock()\">Valider le mouvement</button>`:'Aucun article.'}</div><h3>Articles classés par catégorie (${shownProducts.length})</h3>${stockGroups||(stockFilter==='all'?'<div class=\"card\">Stock vide : ajoutez vos articles.</div>':'<div class=\"card\">Aucun article ne correspond à ce filtre.</div>')}`}
if(page==='tables'){tables=await api('/tables');let orders=await api('/orders');products=await api('/order-products');view.innerHTML=`<h2>Tables & reçus</h2><div class="card"><input id="tn" placeholder="Nom de la table"><button onclick="addTable()">Créer une table</button></div><div class="grid">${tables.map(t=>`<div class="card"><h3>${t.name}</h3><span class="pill">${t.orders} commande(s) ouverte(s)</span><p><button onclick="openOrderCart(${t.id},null)">Nouvelle commande</button><button class="alt" onclick="customerLink(${t.id})">Lien client / QR</button></p><small>Adresse client : ${location.origin}/?table=${t.id}</small></div>`).join('')}</div><h3>Reçus en attente / commandes web</h3>${orders.length?orders.map(o=>`<div class="card"><b>Reçu #${o.id} · ${o.customer}</b> — ${o.table_name||'Sans table'} ${o.source==='client'?'<span class="pill">Commande web</span>':''}<p>${o.items.map(i=>`${i.product_name} × ${i.qty}`).join(' · ')}</p><b>${money(o.total)}</b> <span class="pill">${o.status}</span><div><button onclick="openOrderCart(null,${o.id})">Modifier le panier</button>${['admin','shareholder','cashier'].includes(me.role)?`<button onclick="payOrder(${o.id},${o.total-o.paid-o.credit})">Encaisser</button><button class="alt" onclick="creditOrder(${o.id})">Mettre à crédit</button>`:''}<button class="alt" onclick="printReceipt(${o.id})">Imprimer</button></div></div>`).join(''):'<p>Aucun reçu en attente.</p>'}<div class="card"><div class="row"><h3 style="margin-right:auto">Historique des reçus payés</h3><select id="histPeriod"><option value="day">Jour</option><option value="week">Semaine</option><option value="month">Mois</option><option value="year">Année</option></select><input id="histAnchor" type="date" value="${today()}"><button onclick="loadPaidHistory()">Filtrer</button></div><div id="paidHistory"><small>Chargement de l'historique...</small></div></div>`;loadPaidHistory()}
if(page==='credits'){let cs=await api('/credits');view.innerHTML=`<h2>Ardoises</h2>${cs.length?cs.map(c=>`<div class="card"><b>${c.customer}</b> · Ardoise #${c.id}<p>Initial : ${money(c.amount)} | Solde : <b>${money(c.balance)}</b></p><button onclick="payCredit(${c.id},${c.balance})">Enregistrer un règlement</button></div>`).join(''):'Aucune ardoise ouverte.'}`}
if(page==='staff'){let es=await api('/employees');view.innerHTML=`<h2>Gestion des employés</h2><div class="card"><h3>Créer un compte</h3><div class="row"><input id="en" placeholder="Nom complet"><select id="er"><option value="service">Service</option><option value="cashier">Caisse</option><option value="shareholder">Actionnaire</option>${me.role==='admin'?'<option value="admin">Administrateur</option>':''}</select><input id="ep" inputmode="numeric" placeholder="PIN initial"><input id="esal" type="number" min="0" placeholder="Salaire mensuel FCFA"><button onclick="createEmployee()">Créer l'employé</button></div><small>Le PIN initial sera changé par l'employé à sa première connexion.</small></div><div class="card"><h3>Comptes actifs</h3><div style="overflow:auto"><table><tr><th>Nom</th><th>Poste</th><th>Salaire mensuel</th><th>PIN changé</th><th>Actions</th></tr>${es.filter(x=>x.active).map(x=>`<tr><td>${x.name}</td><td>${({admin:'Administrateur',shareholder:'Actionnaire',service:'Service',cashier:'Caisse'}[x.role]||x.role)}</td><td>${money(x.monthly_salary)}</td><td>${x.pin_changed?'Oui':'Non'}</td><td><button class="alt" onclick='editEmployee(${x.id},${JSON.stringify(x.name)},${JSON.stringify(x.role)},${x.monthly_salary})'>Modifier</button><button class="danger" onclick="deleteEmployee(${x.id},${JSON.stringify(x.name)})">Supprimer</button></td></tr>`).join('')}</table></div></div>${es.some(x=>!x.active)?`<div class="card"><h3>Comptes désactivés</h3>${es.filter(x=>!x.active).map(x=>`<p>${x.name} · ${x.role} <button class="alt" onclick="reactivateEmployee(${x.id})">Réactiver</button></p>`).join('')}</div>`:''}` }
if(page==='payroll'){let es=await api('/employees');let month=monthNow();let data=await api('/payroll?month='+month);let at=await api('/attendance?month='+month);view.innerHTML=`<h2>Présences & salaires</h2><div class="card"><h3>Enregistrer et approuver une présence</h3><select id="ae">${es.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><input id="ad" type="date" value="${today()}"><select id="ast"><option value="present">Présent</option><option value="absent">Absent</option></select><button onclick="saveAttendance()">Enregistrer / approuver</button><p><small>Seules les absences approuvées sont déduites. Calcul au prorata du nombre de jours calendaires du mois.</small></p></div><div class="card"><h3>Bulletin récapitulatif · ${month}</h3><table><tr><th>Employé</th><th>Salaire fixe</th><th>Absences approuvées</th><th>Déduction</th><th>Net à payer</th></tr>${data.employees.map(x=>`<tr><td>${x.name}</td><td>${money(x.monthly_salary)}</td><td>${x.approved_absences}</td><td>${money(x.deduction)}</td><td><b>${money(x.net)}</b></td></tr>`).join('')}</table></div><div class="card"><h3>Historique des présences</h3>${at.length?`<table><tr><th>Date</th><th>Employé</th><th>Statut</th><th>Validation</th></tr>${at.map(x=>`<tr><td>${x.day}</td><td>${x.employee_name}</td><td>${x.status}</td><td>${x.approved?'Approuvé':'En attente'}</td></tr>`).join('')}</table>`:'Aucune présence enregistrée ce mois.'}</div>`}
if(page==='expenses'){let ex=await api('/expenses?month='+monthNow());view.innerHTML=`<h2>Charges & dépenses</h2><div class="card"><h3>Enregistrer une charge</h3><div class="row"><input id="xl" placeholder="Libellé"><input id="xa" type="number" min="1" placeholder="Montant FCFA"><input id="xc" placeholder="Catégorie"><input id="xd" type="date" value="${today()}"><input id="xn" placeholder="Note"><button onclick="saveExpense()">Enregistrer</button></div></div><div class="card"><h3>Charges du mois</h3><table><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Montant</th></tr>${ex.map(x=>`<tr><td>${x.day}</td><td>${x.label}</td><td>${x.category}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div>`}
if(page==='reports'){let d=await api('/reports?period=month&anchor='+today());let st=await api('/admin/storage-status');view.innerHTML=`<h2>Ventes & bénéfices</h2><div class="card"><select id="rp"><option value="day">Jour</option><option value="week">Semaine</option><option value="month" selected>Mois</option><option value="year">Année</option></select><input id="ra" type="date" value="${today()}"><button onclick="loadReport()">Afficher</button></div><div id="reportResult">${reportCards(d)}</div><p><small>Les ventes correspondent aux commandes clôturées. Le coût est calculé à partir du prix d'achat enregistré au moment de chaque vente.</small></p><div class="card"><h3>Conservation des données</h3><p>Base : <b>${st.database_file}</b> · Taille : ${Math.round(st.database_size_bytes/1024)} Ko</p><p>${st.persistent_path?'Stockage persistant détecté (/var/data).':'Attention : chemin de base non reconnu comme disque persistant Render.'}</p><button onclick="backupDatabase()">Créer une sauvegarde maintenant</button><small id="backupStatus"></small></div>`}
if(page==='journal'){let a=await api('/audit');view.innerHTML=`<h2>Journal des activités</h2><div class="card"><table><tr><th>Date</th><th>Employé</th><th>Action</th><th>Détails</th></tr>${a.map(x=>`<tr><td>${x.created}</td><td>${x.employee||'Client / système'}</td><td>${x.action}</td><td>${x.details||''}</td></tr>`).join('')}</table></div>`}
}catch(e){alert(e.message)}}
function reportCards(d){let cats=d.by_category||[];return `<div class="grid"><div class="card">Ventes des commandes clôturées<div class="metric">${money(d.sales)}</div></div><div class="card">Coût des produits vendus<div class="metric">${money(d.cost_of_goods)}</div></div><div class="card">Bénéfice brut estimé<div class="metric">${money(d.gross_profit)}</div></div><div class="card">Charges<div class="metric">${money(d.expenses)}</div></div><div class="card">Bénéfice net estimé<div class="metric">${money(d.net_estimate)}</div></div><div class="card">Commandes clôturées<div class="metric">${d.orders}</div></div></div><div class="card"><h3>Ventilation des encaissements par mode de paiement</h3><div class="grid"><div class="card">Cash<div class="metric">${money(d.cash_received||0)}</div></div><div class="card">Paiement mobile<div class="metric">${money(d.mobile_received||0)}</div></div><div class="card">Total réellement encaissé<div class="metric">${money(d.total_received||0)}</div></div></div>${(d.other_received||0)>0?`<p>Autres / anciens modes : <b>${money(d.other_received)}</b></p>`:''}<small>Les encaissements sont classés selon la date réelle du paiement, y compris les règlements d'ardoises.</small></div><div class="card"><h3>Coût des produits vendus par catégorie</h3>${cats.length?`<table><tr><th>Catégorie</th><th>Quantité vendue</th><th>Ventes</th><th>Coût d'achat</th><th>Bénéfice brut</th></tr>${cats.map(x=>`<tr><td>${x.category}</td><td>${Number(x.quantity||0)}</td><td>${money(x.sales)}</td><td><b>${money(x.cost)}</b></td><td>${money(x.gross_profit)}</td></tr>`).join('')}</table>`:'Aucune vente clôturée sur cette période.'}</div><p>Période : ${d.start} au ${d.end}</p>`}
async function backupDatabase(){try{let d=await api('/admin/backup','POST',{});let r=await fetch('/api/admin/backup/'+encodeURIComponent(d.file),{headers:{'Authorization':token}});if(!r.ok)throw Error('Sauvegarde créée mais téléchargement impossible.');let blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=d.file;a.click();URL.revokeObjectURL(url);$('backupStatus').textContent=' Sauvegarde téléchargée : '+d.file+' ('+Math.round(d.size_bytes/1024)+' Ko).'}catch(e){alert(e.message)}}
async function loadReport(){try{let d=await api('/reports?period='+rp.value+'&anchor='+ra.value);reportResult.innerHTML=reportCards(d)}catch(e){alert(e.message)}}
async function addProduct(){try{let name=pn.value.trim(),stock=pq.value;if(!name||stock==='')throw Error('Renseignez le libellé et la quantité initiale.');await api('/products','POST',{name,stock:+stock,category:pcat.value||'Autres',cost:+(pcost.value||0),price:+(pprice.value||0)});alert('Article enregistré');show('stock')}catch(e){alert(e.message)}}
async function renameProduct(id,current){let name=prompt('Nouveau libellé :',current);if(name===null)return;try{await api('/products/'+id,'PATCH',{name});show('stock')}catch(e){alert(e.message)}}async function archiveProduct(id){if(!confirm('Archiver cet article ?'))return;try{await api('/products/'+id,'DELETE');show('stock')}catch(e){alert(e.message)}}async function moveStock(){try{await api('/movement','POST',{product_id:+mp.value,kind:mk.value,qty:+mq.value,note:mn.value});show('stock')}catch(e){alert(e.message)}}
async function addTable(){try{await api('/tables','POST',{name:tn.value});show('tables')}catch(e){alert(e.message)}}
let cartItems={},cartOriginalQty={},cartTableId=null,cartOrderId=null,cartProducts=[],cartCategoryFilter='all',cartSearchTerm='';
async function openOrderCart(tableId,orderId=null){try{cartTableId=tableId;cartOrderId=orderId;cartCategoryFilter='all';cartSearchTerm='';cartProducts=await api('/order-products');cartItems={};cartOriginalQty={};let customer='Client';if(orderId){let d=await api('/receipt/'+orderId);if(d.order.paid>0||d.order.credit>0)throw Error('Un reçu déjà partiellement réglé ne peut plus être modifié.');customer=d.order.customer;for(const it of d.items){let p=cartProducts.find(x=>x.id===it.product_id);if(p){cartItems[it.product_id]=Number(it.qty);cartOriginalQty[it.product_id]=Number(it.qty);}}}
renderOrderCart(customer)}catch(e){alert(e.message)}}
function renderOrderCart(customer='Client'){let cats=[...new Set(cartProducts.map(p=>(p.category||'Autres').trim()||'Autres'))].sort((a,b)=>a.localeCompare(b,'fr'));let filtered=cartProducts.filter(p=>(cartCategoryFilter==='all'||(p.category||'Autres')===cartCategoryFilter)&&p.name.toLowerCase().includes(cartSearchTerm.toLowerCase()));let lines=Object.entries(cartItems).map(([id,qty])=>{let p=cartProducts.find(x=>x.id===+id);return p?{...p,qty}:null}).filter(Boolean);let total=lines.reduce((n,p)=>n+p.price*p.qty,0);let tableLabel=cartTableId?(tables.find(t=>t.id===cartTableId)?.name||'Table sélectionnée'):'Commande sans table';view.innerHTML=`<div class=\"row\"><h2 style=\"margin-right:auto\">${cartOrderId?'Modifier le reçu #'+cartOrderId:'Nouvelle commande'}</h2><span class=\"pill\">${tableLabel}</span><button class=\"alt\" onclick=\"show('tables')\">← Retour aux tables</button></div><div class=\"card\"><label>Nom du client</label><input id=\"cartCustomer\" value=\"${String(customer).replaceAll('&','&amp;').replaceAll('\"','&quot;').replaceAll('<','&lt;')}\" placeholder=\"Nom du client\" style=\"width:100%\"></div><div class=\"cart-layout\"><div><div class=\"card\"><input id=\"cartSearch\" placeholder=\"Rechercher un article...\" value=\"${cartSearchTerm.replaceAll('\"','&quot;')}\" oninput=\"filterCartProducts()\" style=\"width:100%\"><div class=\"row\"><button class=\"${cartCategoryFilter==='all'?'':'alt'}\" onclick=\"filterCartCategory('all')\">Toutes les catégories</button>${cats.map(c=>`<button class=\"${cartCategoryFilter===c?'':'alt'}\" onclick='filterCartCategory(${JSON.stringify(c)})'>${c}</button>`).join('')}</div><div id=\"cartProductGrid\" class=\"cart-products\">${productTiles(filtered)}</div></div></div><div class=\"card cart-panel\"><h3>🛒 Panier</h3><div id=\"cartLines\">${cartLinesHtml(lines)}</div><div class=\"cart-total\">Total : ${money(total)}</div><button style=\"width:100%;padding:13px\" onclick=\"saveCartOrder()\">${cartOrderId?'Enregistrer les modifications':'Créer le reçu'}</button><button class=\"alt\" style=\"width:100%\" onclick=\"show('tables')\">Annuler</button></div></div>`}
function productTiles(list){return list.map(p=>`<button class="product-tile" onclick="cartAdd(${p.id})" ${Number(p.stock||0)+Number(cartOriginalQty[p.id]||0)<=0?'disabled':''}><b>${p.name}</b><br><small>${p.category||'Autres'} · Stock ${p.stock}</small><p><b>${money(p.price)}</b></p><small>+ Ajouter au panier</small></button>`).join('')||'<p>Aucun article trouvé.</p>'}
function cartLinesHtml(lines){return lines.length?lines.map(p=>`<div class="cart-line"><div><b>${p.name}</b><br><small>${money(p.price)} / unité</small></div><div class="qty-tools"><button class="alt" onclick="cartQty(${p.id},-1)">−</button><b>${p.qty}</b><button onclick="cartQty(${p.id},1)">+</button></div><button class="danger" onclick="cartRemove(${p.id})">×</button></div>`).join(''):'<p>Le panier est vide. Sélectionnez des articles à gauche.</p>'}
function refreshCart(){let lines=Object.entries(cartItems).map(([id,qty])=>{let p=cartProducts.find(x=>x.id===+id);return p?{...p,qty}:null}).filter(Boolean);let total=lines.reduce((n,p)=>n+p.price*p.qty,0);$('cartLines').innerHTML=cartLinesHtml(lines);document.querySelector('.cart-total').textContent='Total : '+money(total)}
function cartAdd(id){let p=cartProducts.find(x=>x.id===id);if(!p)return;let qty=cartItems[id]||0,maxStock=Number(p.stock||0)+Number(cartOriginalQty[id]||0);if(qty+1>maxStock){alert('Stock insuffisant pour '+p.name);return}cartItems[id]=qty+1;refreshCart()}
function cartQty(id,delta){let p=cartProducts.find(x=>x.id===id),q=(cartItems[id]||0)+delta;if(q<1){delete cartItems[id]}else if(p&&q<=Number(p.stock||0)+Number(cartOriginalQty[id]||0)){cartItems[id]=q}else{alert('Stock insuffisant')}refreshCart()}
function cartRemove(id){delete cartItems[id];refreshCart()}
function cartFilteredProducts(){return cartProducts.filter(p=>(cartCategoryFilter==='all'||(p.category||'Autres')===cartCategoryFilter)&&p.name.toLowerCase().includes(cartSearchTerm.toLowerCase()))}
function filterCartProducts(){cartSearchTerm=$('cartSearch').value.toLowerCase();$('cartProductGrid').innerHTML=productTiles(cartFilteredProducts())}
function filterCartCategory(category){cartCategoryFilter=category;$('cartProductGrid').innerHTML=productTiles(cartFilteredProducts())}
async function saveCartOrder(){let items=Object.entries(cartItems).filter(([,qty])=>qty>0).map(([id,qty])=>({product_id:+id,qty:+qty}));if(!items.length){alert('Ajoutez au moins un article au panier.');return}let payload={table_id:cartTableId,customer:$('cartCustomer').value.trim()||'Client',items};try{if(cartOrderId)await api('/orders/'+cartOrderId,'PATCH',payload);else await api('/orders','POST',payload);alert(cartOrderId?'Reçu modifié.':'Commande créée.');show('tables')}catch(e){alert(e.message)}}
async function loadPaidHistory(){try{let d=await api('/orders/history?period='+$('histPeriod').value+'&anchor='+$('histAnchor').value);let s=d.summary;$('paidHistory').innerHTML=`<div class="grid"><div class="card">Reçus payés<div class="metric">${s.receipts}</div></div><div class="card">Ventes<div class="metric">${money(s.sales)}</div></div><div class="card">Coût des produits<div class="metric">${money(s.cost)}</div></div><div class="card">Bénéfice brut<div class="metric">${money(s.gross_profit)}</div></div></div><p><b>Période : ${d.start} au ${d.end}</b> <button class="alt" onclick="printPaidHistory()">Imprimer le rapport</button></p>${d.receipts.length?d.receipts.map(o=>`<div class="card"><div class="row"><b>Reçu #${o.id} · ${o.customer}</b><span class="pill">Payé le ${o.paid_at.slice(0,16).replace('T',' ')}</span><b style="margin-left:auto">${money(o.total)}</b><button class="alt" onclick="printReceipt(${o.id})">Reçu</button></div><small>${o.table_name||'Sans table'} · ${o.items.map(i=>i.product_name+' × '+i.qty).join(' · ')}</small></div>`).join(''):'<p>Aucun reçu payé sur cette période.</p>'}`;window.currentPaidHistory=d}catch(e){alert(e.message)}}
function printPaidHistory(){let d=window.currentPaidHistory;if(!d)return;let w=window.open('','_blank');w.document.write(`<h2>CAVE DE TIBATI — Rapport des reçus payés</h2><p>Période : ${d.start} au ${d.end}</p><p>Nombre de reçus : ${d.summary.receipts}</p><p>Ventes : ${money(d.summary.sales)}</p><p>Coût des produits : ${money(d.summary.cost)}</p><h3>Bénéfice brut : ${money(d.summary.gross_profit)}</h3><hr>${d.receipts.map(o=>`<p>Reçu #${o.id} — ${o.customer} — ${o.paid_at} — ${money(o.total)}</p>`).join('')}`);w.document.close();w.print()}
function paymentDialog(title,amountLabel,defaultAmount,onConfirm){let old=document.getElementById('paymentModal');if(old)old.remove();let box=document.createElement('div');box.id='paymentModal';box.style.cssText='position:fixed;inset:0;background:#0008;z-index:9999;display:grid;place-items:center;padding:16px';box.innerHTML=`<div class="card" style="width:min(420px,100%);margin:0"><h2>${title}</h2><label>${amountLabel}</label><input id="paymentAmount" type="number" min="1" step="1" value="${defaultAmount}" style="width:100%"><label>Mode de paiement</label><select id="paymentMethod" style="width:100%"><option value="Cash">Cash</option><option value="Paiement mobile">Paiement mobile</option></select><div class="row" style="margin-top:12px"><button id="paymentConfirm">Valider l'encaissement</button><button class="alt" id="paymentCancel">Annuler</button></div></div>`;document.body.appendChild(box);box.querySelector('#paymentCancel').onclick=()=>box.remove();box.querySelector('#paymentConfirm').onclick=async()=>{let amount=Number(box.querySelector('#paymentAmount').value),method=box.querySelector('#paymentMethod').value;if(!Number.isFinite(amount)||amount<=0){alert('Saisissez un montant valide.');return}box.querySelector('#paymentConfirm').disabled=true;try{await onConfirm(amount,method);box.remove()}catch(e){alert(e.message);box.querySelector('#paymentConfirm').disabled=false}}}async function payOrder(id,due){paymentDialog('Encaisser le reçu #'+id,'Montant encaissé (reste dû '+money(due)+')',due,async(amount,method)=>{await api(`/orders/${id}/pay`,'POST',{amount,method});show('tables')})}async function creditOrder(id){if(!confirm('Confirmer la mise à crédit ?'))return;try{await api(`/orders/${id}/credit`,'POST',{});show('tables')}catch(e){alert(e.message)}}async function payCredit(id,balance){paymentDialog('Règlement de l’ardoise #'+id,'Montant reçu (solde '+money(balance)+')',balance,async(amount,method)=>{await api(`/credits/${id}/pay`,'POST',{amount,method});show('credits')})}
async function printReceipt(id){let d=await api('/receipt/'+id);let w=window.open('','_blank');if(!w){alert('Autorisez les fenêtres contextuelles pour imprimer le reçu.');return}let rows=d.items.map(i=>`<div class="item"><span>${i.product_name} × ${i.qty}</span><b>${money(i.qty*i.unit_price)}</b></div>`).join('');w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reçu ${id}</title><style>@page{size:58mm auto;margin:3mm}body{width:48mm;margin:0;font:10px monospace;color:#000}h2{text-align:center;font-size:14px;margin:0 0 5px}.center{text-align:center}.line{border-top:1px dashed #000;margin:6px 0}.item{display:flex;justify-content:space-between;gap:4px;margin:4px 0}.item span{max-width:30mm;overflow-wrap:anywhere}.total{font-weight:bold;font-size:13px;text-align:right}</style></head><body><h2>CAVE DE TIBATI</h2><p class="center">Reçu #${id}</p><p>Client : ${d.order.customer||'Client'}</p><p>Date : ${(d.order.created||'').replace('T',' ')}</p><p>Table : ${d.order.table_name||'Comptoir'}</p><div class="line"></div>${rows}<div class="line"></div><p class="total">TOTAL : ${money(d.total)}</p><p>Déjà payé : ${money(d.order.paid)}</p><p>Reste : ${money(Math.max(0,d.total-d.order.paid-d.order.credit))}</p><div class="line"></div><p class="center">Merci de votre confiance !</p><p class="center">CAVE DE TIBATI</p></body></html>`);w.document.close();setTimeout(()=>w.print(),400)}
async function createEmployee(){try{await api('/employees','POST',{name:en.value,role:er.value,pin:ep.value,monthly_salary:+(esal.value||0)});alert('Compte créé. L’employé devra changer son PIN à sa première connexion.');show('staff')}catch(e){alert(e.message)}}
async function editEmployee(id,name,role,salary){let n=prompt('Nom complet :',name);if(n===null)return;let roles={admin:'Administrateur',shareholder:'Actionnaire',service:'Service',cashier:'Caisse'};let roleLabel=prompt('Poste (admin, shareholder, service, cashier) :',role);if(roleLabel===null)return;if(!['admin','shareholder','service','cashier'].includes(roleLabel)){alert('Poste invalide.');return}let s=prompt('Salaire mensuel en FCFA :',salary);if(s===null)return;let pin=prompt('Nouveau PIN initial (laisser vide pour ne pas changer) :','');try{await api('/employees/'+id,'PATCH',{name:n,role:roleLabel,monthly_salary:+s,new_pin:pin||null});show('staff')}catch(e){alert(e.message)}}
async function deleteEmployee(id,name){if(!confirm('Désactiver le compte de '+name+' ? L’historique de cet employé sera conservé.'))return;try{await api('/employees/'+id,'DELETE');alert('Compte désactivé. Les anciennes ventes et présences sont conservées.');show('staff')}catch(e){alert(e.message)}}
async function reactivateEmployee(id){try{await api('/employees/'+id,'PATCH',{active:true});show('staff')}catch(e){alert(e.message)}}
async function saveAttendance(){try{await api('/attendance','POST',{employee_id:+ae.value,day:ad.value,status:ast.value});alert('Présence enregistrée et approuvée.');show('payroll')}catch(e){alert(e.message)}}async function saveExpense(){try{await api('/expenses','POST',{label:xl.value,amount:+xa.value,category:xc.value||'Autres',day:xd.value,note:xn.value});show('expenses')}catch(e){alert(e.message)}}
function customerLink(id){let url=location.origin+'/?table='+id;navigator.clipboard?.writeText(url);alert('Lien client copié : '+url)}async function customerPage(tid){$('login').classList.add('hidden');$('app').classList.remove('hidden');let r=await fetch('/api/public/'+tid+'/menu');let d=await r.json();if(!r.ok){view.innerHTML='<div class="card">Table inconnue.</div>';return}view.innerHTML=`<h2>Commande à ${d.table.name}</h2><p>Choisissez vos articles. La commande sera transmise à la caisse.</p><input id="cust" placeholder="Votre nom"><div class="grid">${d.products.map(p=>`<div class="card"><b>${p.name}</b><p>${money(p.price)}</p><input type="number" min="0" value="0" id="q${p.id}" style="width:90px"></div>`).join('')}</div><button onclick="sendCustomer(${tid})">Envoyer ma commande</button>`;products=d.products}
async function sendCustomer(tid){let items=products.map(p=>({product_id:p.id,qty:+$('q'+p.id).value})).filter(x=>x.qty>0);try{let r=await fetch('/api/customer/'+tid+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table_id:tid,customer:$('cust').value||'Client',items})});let d=await r.json();if(!r.ok)throw Error(d.detail);view.innerHTML=`<div class="card"><h2>Commande envoyée !</h2><p>${d.message}</p><b>Commande #${d.id}</b></div>`}catch(e){alert(e.message)}}
let tid=new URLSearchParams(location.search).get('table');if(tid)customerPage(+tid);else restoreSession();
</script></body></html>
