<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cave de Tibati</title><style>
:root{--bg:#f5f2ee;--ink:#211b1a;--wine:#641f32;--gold:#c69b52;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:var(--ink)}header{background:#27191d;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px;color:#e5c17c}.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 10px #0001;margin-bottom:12px}.metric{font-size:26px;font-weight:bold;color:var(--wine)}button{background:var(--wine);color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;margin:3px}button.alt{background:#796b65}input,select{padding:10px;border:1px solid #ddd;border-radius:7px;margin:4px;max-width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}small{color:#777}.pill{background:#f4e6d9;border-radius:20px;padding:5px 9px}nav{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}nav button{background:#80666a}.danger{color:#b21d32}@media(max-width:600px){header{align-items:flex-start;gap:8px;flex-direction:column}.wrap{padding:10px}td,th{padding:6px;font-size:13px}}
</style></head><body><header><b>🍷 CAVE DE TIBATI</b><span id="who">Gestion intégrée</span></header><main class="wrap">
<section id="login" class="card"><h2>Connexion employé</h2><p>Entrez votre PIN personnel.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN" maxlength="8"><button onclick="login()">Se connecter</button><p><small>Premier accès : PIN administrateur provisoire 1234. À changer en créant un compte admin sécurisé.</small></p></section>
<section id="app" class="hidden"><nav><button onclick="show('home')">Tableau de bord</button><button onclick="show('stock')">Stocks</button><button onclick="show('tables')">Tables & reçus</button><button onclick="show('credits')">Ardoises</button><button onclick="show('staff')">Employés / journal</button></nav><div id="view"></div></section>
</main><script>
let token='',me=null,products=[],tables=[];
const api=async(path,method='GET',body=null)=>{let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','Authorization':token},body:body?JSON.stringify(body):null});let d=await r.json();if(!r.ok)throw Error(d.detail||'Erreur');return d};
const money=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';
async function login(){try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})});let d=await r.json();if(!r.ok)throw Error(d.detail);token=d.token;me=d.employee;document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');who.textContent=me.name+' · '+me.role;show('home')}catch(e){alert(e.message)}}
async function show(page){try{
if(page==='home'){let d=await api('/dashboard');view.innerHTML=`<h2>Vue d'ensemble</h2><div class="grid"><div class="card">Références produits<div class="metric">${d.products.n}</div></div><div class="card">Ruptures<div class="metric danger">${d.products.ruptures||0}</div></div><div class="card">Alertes stock<div class="metric">${d.products.alertes||0}</div></div><div class="card">Valeur du stock<div class="metric">${money(d.products.valeur)}</div></div><div class="card">Ardoises ouvertes<div class="metric">${money(d.credits)}</div></div><div class="card">Commandes en attente<div class="metric">${d.open_orders.n}</div></div></div>`}
if(page==='stock'){products=await api('/products');view.innerHTML=`<h2>Gestion des stocks</h2><div class="card"><h3>Enregistrer un nouvel article</h3><p><small>Le stock est vide au départ : ajoute toi-même chaque article et sa quantité initiale.</small></p><div class="row"><input id="pn" placeholder="Libellé de l'article (obligatoire)" required><input id="pq" type="number" min="0" step="0.01" placeholder="Quantité initiale" required><input id="pcat" placeholder="Catégorie (facultatif)"><input id="pcost" type="number" min="0" step="1" placeholder="Prix d'achat (facultatif)"><input id="pprice" type="number" min="0" step="1" placeholder="Prix de vente (facultatif)"><button onclick="addProduct()">Enregistrer l'article</button></div></div><div class="card"><h3>Réception / sortie / inventaire</h3>${products.length?`<select id="mp">${products.map(p=>`<option value="${p.id}">${p.name} (stock ${p.stock})</option>`).join('')}</select><select id="mk"><option value="in">Entrée</option><option value="out">Sortie</option><option value="adjust">Ajuster à</option></select><input id="mq" type="number" min=".01" step=".01" placeholder="Quantité"><input id="mn" placeholder="Motif"><button onclick="move()">Enregistrer le mouvement</button>`:'<p>Aucun article enregistré. Ajoute d’abord tes articles ci-dessus.</p>'}</div><div class="card"><h3>Articles enregistrés (${products.length})</h3>${products.length?`<table><tr><th>Libellé</th><th>Catégorie</th><th>Quantité</th><th>Prix de vente</th><th>Action</th></tr>${products.map(p=>`<tr><td>${p.name}</td><td>${p.category||'—'}</td><td>${p.stock}</td><td>${money(p.price)}</td><td><button class="alt" onclick="renameProduct(${p.id},${JSON.stringify(p.name).replace(/\"/g,'&quot;')})">Renommer</button><button class="alt" onclick="archiveProduct(${p.id})">Archiver</button></td></tr>`).join('')}</table>`:'<p>Ton stock est actuellement vide.</p>'}</div>`}
if(page==='tables'){tables=await api('/tables');let orders=await api('/orders');products=await api('/products');view.innerHTML=`<h2>Tables & reçus individuels</h2><div class="card"><input id="tn" placeholder="Nom de la table (ex. Table 1)"><button onclick="addTable()">Créer la table</button></div><div class="grid">${tables.map(t=>`<div class="card"><h3>${t.name}</h3><span class="pill">${t.orders} commande(s) ouverte(s)</span><p><button onclick="newOrder(${t.id})">Nouvelle commande client</button><button class="alt" onclick="customerLink(${t.id})">Lien client</button></p><small>Lien public : /?table=${t.id}</small></div>`).join('')}</div><h3>Reçus en attente</h3>${orders.length?orders.map(o=>`<div class="card"><b>Reçu #${o.id} · ${o.customer}</b> — ${o.table_name||'Sans table'}<p>${o.items.map(i=>`${i.product_name} × ${i.qty}`).join(' · ')}</p><b>${money(o.total)}</b> <span class="pill">${o.status}</span><div><button onclick="pay(${o.id},${o.total-o.paid-o.credit})">Encaisser</button><button class="alt" onclick="credit(${o.id})">Mettre à crédit</button><button class="alt" onclick="printReceipt(${o.id})">Imprimer reçu</button></div></div>`).join(''):'<p>Aucun reçu en attente.</p>'}`}
if(page==='credits'){let cs=await api('/credits');view.innerHTML=`<h2>Suivi des ardoises</h2>${cs.length?cs.map(c=>`<div class="card"><b>${c.customer}</b> · Ardoise #${c.id}<p>Montant initial : ${money(c.amount)} | Solde : <b>${money(c.balance)}</b></p><button onclick="creditPay(${c.id},${c.balance})">Enregistrer un règlement</button></div>`).join(''):'<p>Aucune ardoise ouverte.</p>'}`}
if(page==='staff'){if(me.role!=='admin'){view.innerHTML='<p>Accès réservé à l’administration.</p>';return}let a=await api('/audit');view.innerHTML=`<h2>Employés & journal d'activité</h2><div class="card"><input id="en" placeholder="Nom employé"><input id="er" placeholder="Fonction" value="serveur"><input id="ep" placeholder="PIN (4 chiffres minimum)" inputmode="numeric"><button onclick="addEmployee()">Créer employé</button></div><div class="card"><h3>Dernières actions</h3><table><tr><th>Date</th><th>Employé</th><th>Action</th><th>Détails</th></tr>${a.map(x=>`<tr><td>${x.created}</td><td>${x.employee||'Système/client'}</td><td>${x.action}</td><td>${x.details||''}</td></tr>`).join('')}</table></div>`}
}catch(e){alert(e.message)}}
async function addProduct(){try{const name=document.querySelector('#pn').value.trim();const stock=document.querySelector('#pq').value;if(!name||stock===''){alert("Renseigne le libellé et la quantité initiale.");return}await api('/products','POST',{name,stock:+stock,category:document.querySelector('#pcat').value||'Autres',cost:+(document.querySelector('#pcost').value||0),price:+(document.querySelector('#pprice').value||0)});alert('Article enregistré.');show('stock')}catch(e){alert(e.message)}}
async function renameProduct(id,current){const name=prompt('Nouveau libellé :',current);if(name===null)return;try{await api('/products/'+id,'PATCH',{name});show('stock')}catch(e){alert(e.message)}}
async function archiveProduct(id){if(!confirm('Archiver cet article ? Il ne sera plus proposé dans les commandes.'))return;try{await api('/products/'+id,'DELETE');show('stock')}catch(e){alert(e.message)}}
async function move(){try{await api('/movement','POST',{product_id:+mp.value,kind:mk.value,qty:+mq.value,note:mn.value});show('stock')}catch(e){alert(e.message)}}
async function addTable(){try{await api('/tables','POST',{name:tn.value});show('tables')}catch(e){alert(e.message)}}
async function newOrder(tid){let customer=prompt('Nom du client :','Client');if(customer===null)return;let lines=[];while(true){let list=products.map((p,i)=>`${i+1}. ${p.name} — ${money(p.price)} (stock ${p.stock})`).join('\n');let n=prompt('Choisissez le numéro du produit (vide pour terminer) :\n'+list,'');if(!n)break;let p=products[+n-1];if(!p){alert('Numéro invalide');continue}let q=+(prompt('Quantité de '+p.name,'1'));if(q>0)lines.push({product_id:p.id,qty:q})}if(!lines.length)return;try{await api('/orders','POST',{table_id:tid,customer,items:lines});show('tables')}catch(e){alert(e.message)}}
async function pay(id,due){let amount=+(prompt('Montant encaissé (reste dû '+money(due)+')',due));if(!amount)return;try{await api(`/orders/${id}/pay`,'POST',{amount,method:'Espèces'});show('tables')}catch(e){alert(e.message)}}
async function credit(id){if(!confirm('Confirmer la mise à crédit du solde ?'))return;try{await api(`/orders/${id}/credit`,'POST',{});show('tables')}catch(e){alert(e.message)}}
async function creditPay(id,balance){let amount=+(prompt('Montant reçu (solde '+money(balance)+')',balance));if(!amount)return;try{await api(`/credits/${id}/pay`,'POST',{amount});show('credits')}catch(e){alert(e.message)}}
async function printReceipt(id){let d=await api('/receipt/'+id);let w=window.open('','_blank');w.document.write(`<h2>CAVE DE TIBATI</h2><p>Reçu #${id} · ${d.order.customer}</p><hr>${d.items.map(i=>`<p>${i.product_name} × ${i.qty} — ${money(i.qty*i.unit_price)}</p>`).join('')}<hr><h3>Total : ${money(d.total)}</h3><p>Merci de votre confiance !</p>`);w.print()}
async function addEmployee(){try{await api('/employees','POST',{name:en.value,role:er.value,pin:ep.value});alert('Employé créé');show('staff')}catch(e){alert(e.message)}}
function customerLink(id){let url=location.origin+'/?table='+id;navigator.clipboard?.writeText(url);alert('Lien client copié : '+url)}
async function customerPage(tid){document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');let d=await fetch('/api/public/'+tid+'/menu').then(r=>r.json());view.innerHTML=`<h2>Commande à ${d.table.name}</h2><p>Choisissez vos articles. La commande sera envoyée à l'équipe.</p><input id="cust" placeholder="Votre nom"><div class="grid">${d.products.map(p=>`<div class="card"><b>${p.name}</b><p>${money(p.price)}</p><input type="number" min="0" value="0" id="q${p.id}" style="width:90px"></div>`).join('')}</div><button onclick="sendCustomer(${tid})">Envoyer ma commande</button>`;products=d.products}
async function sendCustomer(tid){let items=products.map(p=>({product_id:p.id,qty:+document.querySelector('#q'+p.id).value})).filter(x=>x.qty>0);try{let r=await fetch('/api/customer/'+tid+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table_id:tid,customer:cust.value||'Client',items})});let d=await r.json();if(!r.ok)throw Error(d.detail);view.innerHTML='<div class="card"><h2>Commande envoyée !</h2><p>'+d.message+'</p><b>Commande #'+d.id+'</b></div>'}catch(e){alert(e.message)}}
let tid=new URLSearchParams(location.search).get('table');if(tid)customerPage(+tid);
</script></body></html>
